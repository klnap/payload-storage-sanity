name: Release
on:
  push:
    tags: ["v*"]
permissions: {}
cache-mode: none
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
          no-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
          package-manager-cache: false
      - name: Check tag and branch
        id: meta
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          test "v$version" = "$TAG" || { echo "Tag does not match package version"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "Tag commit is not on main"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run knip
      - run: bun run check:boundaries
      - run: bun test src tests
      - run: bun run build
      - run: bun run check:package
      - run: bun audit --audit-level=high
      - uses: zizmorcore/zizmor-action@bd12b495c90993a4301c73398142281a61499af3 # v0.9.0
        with:
          advanced-security: false
      - name: Pack the release tarball
        id: pack
        run: |
          mkdir -p release
          npm pack --silent --pack-destination release
          cd release
          echo "sha256=$(sha256sum ./*.tgz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Smoke-test the exact tarball
        run: bash scripts/consumer-smoke.sh release/*.tgz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-tarball
          path: release/*.tgz
          if-no-files-found: error
  publish:
    needs: validate
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-tarball
      - name: Publish the qualified tarball
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          EXPECTED_SHA256: ${{ needs.validate.outputs.sha256 }}
        run: |
          tgz="klnap-payload-storage-sanity-$VERSION.tgz"
          echo "$EXPECTED_SHA256  $tgz" | sha256sum --check
          if npm view "@klnap/payload-storage-sanity@$VERSION" version >/dev/null 2>&1; then
            echo "Version already exists; verifying integrity before creating a release."
          else
            npm publish "./$tgz" --provenance --access public
          fi
  github-release:
    needs: [validate, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-tarball
      - name: Create GitHub release after npm integrity verification
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          tgz="klnap-payload-storage-sanity-$VERSION.tgz"
          local_integrity="sha512-$(openssl dgst -sha512 -binary "$tgz" | base64 -w0)"
          npm_integrity=""
          for attempt in {1..12}; do
            npm_integrity="$(npm view "@klnap/payload-storage-sanity@$VERSION" dist.integrity 2>/dev/null)" && break
            sleep 10
          done
          test "$local_integrity" = "$npm_integrity" || { echo "npm tarball differs from the qualified tarball"; exit 1; }
          tar -xzOf "$tgz" package/CHANGELOG.md | awk -v v="$VERSION" '$0 ~ "^## \\[?"v"\\]?" {f=1; next} /^## / {f=0} f' > notes.md
          test -s notes.md || { echo "No CHANGELOG section for $VERSION"; exit 1; }
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$tgz" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$tgz" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes-file notes.md
          fi
